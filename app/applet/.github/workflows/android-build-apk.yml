name: Build & Export Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (creates a permanent public download)'
        required: false
        type: boolean
        default: false
      release_title:
        description: 'Release Title (optional)'
        required: false
        type: string
        default: 'Sarkari Job Alert App v1.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Environment and Keystore
        run: |
          echo "Setting up environment configuration..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "Ensuring debug.keystore exists..."
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating new debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p build-artifacts
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "build-artifacts/SarkariJobAlert-v1.0-debug.apk"
            echo "Successfully prepared APK: build-artifacts/SarkariJobAlert-v1.0-debug.apk"
            ls -lh build-artifacts/
          else
            echo "ERROR: APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts (Instant Download)
        uses: actions/upload-artifact@v4
        with:
          name: Sarkari-Job-Alert-Debug-APK
          path: build-artifacts/SarkariJobAlert-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build-artifacts/SarkariJobAlert-v1.0-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 Sarkari Job Alert Android Application

            **What's inside this build:**
            - ✅ Live Category Switcher with vacancy count badges
            - ✅ Urgent deadline countdown indicators (`🚨 Closes Today!`, `⏳ Days Left`)
            - ✅ Quick Action Bar: One-tap PDF Notice, Apply Portal, and Study Group Share
            - ✅ Recruitment Lifecycle Timeline Stepper
            - ✅ Candidate Utility Calculators: 7th CPC In-Hand Salary & Age Cutoff Eligibility
            - ✅ Official Gazette & Verified Source Badges

            #### 📥 Download Link:
            Click below on `SarkariJobAlert-v1.0-debug.apk` in the Assets section to install on any Android phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
