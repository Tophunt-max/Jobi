# Admin panel served as static files by a Cloudflare Worker (Workers Static Assets).
# Build first:  NEXT_PUBLIC_API_URL=https://<worker-url> npm run build
# Deploy:       npx wrangler deploy
# public/_headers (copied into out/) sets the security headers.
# The admin key is entered on the sign-in screen and is never part of the build.
name = "sarkari-jobs-admin"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./out"
not_found_handling = "404-page"
