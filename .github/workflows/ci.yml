name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Worker - migrations + API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-cloudflare/package-lock.json
      - run: npm ci
      - name: Apply migrations to a local D1 database
        run: npx wrangler d1 migrations apply rozgarone_db --local
        env:
          CI: '1'
      - name: Seed sample data (local only)
        run: npm run db:seed:local
        env:
          CI: '1'
      - name: Smoke test the API against wrangler dev
        run: |
          echo "ADMIN_API_KEY=\"ci_$(openssl rand -hex 24)\"" > .dev.vars
          ./test/run-local.sh

  admin-panel:
    name: Admin panel - typecheck + static build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure no admin secret is bundled
        run: |
          if grep -rIl "rozgarone_admin_secret" out/; then
            echo "::error::Admin key found in static bundle"; exit 1
          fi
