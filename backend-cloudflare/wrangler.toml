name = "sarkari-jobs-worker"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Secrets are NOT stored here. Set them once per environment:
#   openssl rand -base64 48 | npx wrangler secret put ADMIN_API_KEY   (required, >= 32 chars)
#   npx wrangler secret put GEMINI_API_KEY                             (AI mentor)
#   openssl rand -hex 16 | npx wrangler secret put REPORT_SALT         (optional)
# The admin API refuses all requests until ADMIN_API_KEY is set.

[vars]
ENVIRONMENT = "production"
# Comma-separated list of browser origins allowed to call /api/admin/* (your admin panel URL).
ADMIN_ALLOWED_ORIGINS = "https://sarkari-jobs-admin.bubunmohanta14.workers.dev"
# Gemini model used by the AI mentor proxy (POST /api/ai/generate).
GEMINI_MODEL = "gemini-2.5-flash"

[observability]
enabled = true

# Cloudflare D1. Replace database_id with the ID printed by:
#   npx wrangler d1 create sarkari_jobs_db
# Schema is managed with migrations:  npx wrangler d1 migrations apply sarkari_jobs_db --remote
[[d1_databases]]
binding = "DB"
database_name = "sarkari_jobs_db"
database_id = "5a700429-01e4-4fb9-941f-c2aeabc2d1e9"
migrations_dir = "migrations"

# Cloudflare R2 bucket for uploaded notice PDFs. Disabled until R2 is enabled on the
# account (Dashboard > R2). Without it, PDF upload returns 503; everything else works.
# After enabling: npx wrangler r2 bucket create sarkari-job-docs, then uncomment.
# [[r2_buckets]]
# binding = "FILES_BUCKET"
# bucket_name = "sarkari-job-docs"

# Workers Rate Limiting (per Cloudflare location, per client IP).
[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 6, period = 60 }

# Importer cron. Each source is only fetched when its polling_interval_hours has elapsed.
[triggers]
crons = ["0 */3 * * *"]

# Local development: `npm run dev` reads secrets from .dev.vars (gitignored).
