name = "sarkari-jobs-worker"
main = "src/index.js"
compatibility_date = "2024-04-01"

[vars]
ENVIRONMENT = "production"
ADMIN_API_KEY = "sarkari_admin_secret_key_change_me"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sarkari_jobs_db"
database_id = "your-d1-database-id-after-creation"

# Cloudflare R2 Object Storage Binding (0 Egress Fees!)
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "sarkari-job-docs"
