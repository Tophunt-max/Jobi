# Web build of the Expo app, served by Workers Static Assets.
#
# Build:   APP_VARIANT=production npx expo export --platform web
# Deploy:  npx wrangler deploy
name = "rozgarone-web"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
# Single-page app: unknown paths serve index.html so client-side routes work on reload.
not_found_handling = "single-page-application"
